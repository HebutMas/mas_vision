calibration:
  camera: usbcamera # usbcamera/hikcamera
  board:
    rows: 10 # 棋盘格内角点行数
    cols: 7 # 棋盘格内角点列数
    square_size: 0.015 # 方格边长(米)
  samples: 10 # 需要多少张有效图(控制台按 s 手动触发保存)
  output: apps/calibration/result.yaml # 结果文件
hikcamera:
  serial: "" # 留空则用枚举到的第一台
  exposure_us: 5000
  gain_db: 10
  framerate: 0
  demosaic: edge_aware
  roi:
    enable: false
    x: 0
    y: 0
    width: 0
    height: 0
usbcamera:
  device_path: /dev/video0
  width: 1280
  height: 720
  fps: 30
  fourcc: MJPG
  auto_exposure_enable: 0 # 1=自动,0=手动(此时 exposure/gain 生效)
  exposure: 500
  gain: 10
  auto_wb: 1
