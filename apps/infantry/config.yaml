serial:
  debug: false # 打印接收的 16 进制原始数据
  port: /dev/gimbal
  baudrate: 115200
  bytesize: 8 # 5/6/7/8
  parity: none # none/even/odd
  stopbits: 1 # 1/2
  flowcontrol: none # none/rtscts
  timestamp_offset: 0.0
hikcamera:
  serial: "" # 留空则用枚举到的第一台
  exposure_us: 5000
  gain_db: 10
  framerate: 0 # <=0:跑相机最大帧率
  demosaic: edge_aware # bilinear/edge_aware
  roi:
    enable: false
    x: 0
    y: 0
    width: 0 # <=0:整幅
    height: 0 # <=0:整幅
usbcamera:
  device_path: /dev/video0
  width: 1280
  height: 720
  fps: 30
  fourcc: MJPG # MJPG/YUYV
  auto_exposure_enable: 0 # 1=自动,0=手动
  exposure: 50 # 仅手动模式
  gain: 20 # 仅手动模式
  auto_wb: 1 # 0=禁用,1=启用
detector:
  model: modules/auto_armor/models/shenzhen-0526.onnx # 相对仓库根目录
  device: CPU
  input: [640, 640]
  min_confidence: 0.5
  score_threshold: 0.7
  nms_threshold: 0.3
  roi: {enable: false, x: 420, y: 50, width: 600, height: 600}
  green_light: # 前哨站/基地绿灯滤除
    enable: true
    green_threshold: 120
    min_area: 20
    min_circularity: 0.6
    max_aspect_ratio: 1.5
  enemy_color: "" # 颜色判断，空代表都识别
track:
  algorithm: null
shoot:
  algorithm: null
