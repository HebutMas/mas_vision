# 新兵种配置模板:复制到 apps/<new>/config.yaml 后按需修改。
serial:
  debug: false
  port: /dev/gimbal
  baudrate: 115200
  bytesize: 8
  parity: none
  stopbits: 1
  flowcontrol: none
  timestamp_offset: 0.0
# 手眼/安装标定值
calibration:
  r_camera2gimbal: [-0.0083195760046954614, 0.010498791137270739, 0.99991027599468041, -0.99960756138647755, -0.026835747568381807, -0.0080352891314148939, 0.026748978935305992, -0.99958472279097077, 0.010717933047771133]
  t_camera2gimbal: [0.094969301833534511, 0.095006290298006682, 0.050987066291756609]
  r_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]
hikcamera:
  serial: ""
  exposure_us: 3000
  gain_db: 0
usbcamera:
  device_path: /dev/video0
  width: 1280
  height: 720
  fps: 30
  fourcc: MJPG
  auto_exposure_enable: 1 # 1=自动,0=手动(此时 exposure/gain 生效)
  exposure: 50
  gain: 20
  auto_wb: 0
auto_aim:
  detector:
    algorithm: null
  track:
    algorithm: null
  shoot:
    algorithm: null
