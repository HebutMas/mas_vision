calibration_handeye:
  camera: hikcamera # usbcamera/hikcamera
  board:
    rows: 10 # 棋盘格内角点行数
    cols: 7 # 棋盘格内角点列数
    square_size: 0.015 # 方格边长(米)
  samples: 30 # 需要多少组,控制台按 s 手动触发
  output: apps/calibration_handeye/result.yaml # 结果文件
serial:
  debug: false # 打印接收的 16 进制原始数据
  port: /dev/gimbal
  baudrate: 115200
  bytesize: 8 # 5/6/7/8
  parity: none # none/even/odd
  stopbits: 1 # 1/2
  flowcontrol: none # none/rtscts
  timestamp_offset: 0.0
  imu_to_gimbal_rpy: [0.0, 0.0, 180.0] # IMU 系 -> 云台系 的安装旋转(ZYX 欧拉角,单位度)
hikcamera:
  serial: "" # 留空则用枚举到的第一台
  exposure_us: 5000
  gain_db: 10
  framerate: 0
  demosaic: edge_aware
  roi:
    enable: false
    x: 0
    y: 0
    width: 0
    height: 0
  # 相机内参
  camera_matrix: [1818.3669452465165, 0.0, 751.06226574703498, 0.0, 1822.494494078506, 530.43671556112133, 0.0, 0.0, 1.0]
  distort_coeffs: [-0.077944626599568856, 0.15447826031486889, -0.0025714394278524674, 0.00083016311301273629, 0.0]
usbcamera:
  device_path: /dev/video0
  width: 1280
  height: 720
  fps: 30
  fourcc: MJPG
  auto_exposure_enable: 0 # 1=自动,0=手动(此时 exposure/gain 生效)
  exposure: 500
  gain: 10
  auto_wb: 1
