# 构建(需先把海康 MVS 压缩包放到仓库根目录、命名为 MVS.tar.gz):
#   docker compose -f docker/compose.yaml build
# 运行开发(仓库挂载在 /work):
#   docker compose -f docker/compose.yaml run -T --rm ubuntu22 \
#     bash -c 'cmake -S . -B build-docker-ubuntu22 -G Ninja && cmake --build build-docker-ubuntu22 -j && ctest --test-dir build-docker-ubuntu22 --output-on-failure'
x-base: &base
  volumes:
    - ..:/work
  working_dir: /work
  # 以宿主用户身份运行。
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  # 直通核显,供 VAAPI 硬件编码
  devices:
    - /dev/dri:/dev/dri

services:
  ubuntu22:
    <<: *base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ubuntu:22.04
        MVS_TARBALL: ${MVS_TARBALL:-MVS.tar.gz}
    image: rm_vision:ubuntu22.04

  debian13:
    <<: *base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: debian:13
        MVS_TARBALL: ${MVS_TARBALL:-MVS.tar.gz}
    image: rm_vision:debian13
